<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <title>Order Editor</title>
</head>

<body>

<h3>✏️ Chỉnh sửa đơn hàng</h3>

<label>Người đóng</label>
<select id="dong"></select>

<label>Người soạn</label>
<select id="soan"></select>

<label>Người giao</label>
<select id="giao"></select>

<label>Số kiện</label>
<input id="so_kien" type="number" min="0">

<button onclick="submitForm()">SUBMIT</button>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

console.log(tg.initData);
console.log(tg.initDataUnsafe);


  const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const startapp = tg.initDataUnsafe.start_param;

function decodeBase64Url(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');

  while (str.length % 4) {
    str += '=';
  }

  const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));

  return new TextDecoder().decode(bytes);
}

const payload = JSON.parse(decodeBase64Url(startapp));

console.log(payload);

function submitForm() {

  const data = {
    dong_id: document.getElementById("dong").value,
    soan_id: document.getElementById("soan").value,
    giao_id: document.getElementById("giao").value,
    so_kien: Number(document.getElementById("so_kien").value)
  };

  // Gửi dữ liệu về Telegram Bot
  tg.sendData(JSON.stringify(data));
}
</script>

</body>
</html>

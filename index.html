       SUBMIT BUTTON
       ===================================================== */

        color: var(--button-text);
        font-size: 15px;
        font-weight: 700;

       LOADING
       ===================================================== */

      /* =====================================================
       MOBILE
       ===================================================== */

        .title {
          font-size: 18px;
        }

        .section {
          padding: 9px;
        }
      }

            setTimeout(() => {
              if (tg.close) {
                tg.close();
              }
            }, 500);
          } catch (error) {
            console.error("N8N WEBHOOK ERROR:", error);
            button.disabled = false;
            button.textContent = "CẬP NHẬT THÔNG TIN";
            if (tg.HapticFeedback) {
              tg.HapticFeedback.notificationOccurred("error");
            }
            showError("Không thể lưu đơn hàng: " + error.message);
          }
        }
        // =====================================================
        // INIT
        // =====================================================
        function init() {
          try {
            // ================================================
            // GET PAYLOAD
            // ================================================
            orderPayload = getPayload();
            if (!orderPayload) {
              showError("Không có dữ liệu đơn hàng.");
              return;
            }
            // ================================================
            // ORDER ID
            // ================================================
            document.getElementById("orderId").textContent = orderPayload.id ?? "...";
            // ================================================
            // ORDER CODE
            // ================================================
            document.getElementById("orderCode").textContent = orderPayload.code ?? "...";
            // ================================================
            // PEOPLE
            // ================================================
            const people = Array.isArray(orderPayload.p) ? orderPayload.p : [];
            // ================================================
            // NGƯỜI ĐÓNG
            // ================================================
            createPeopleSelector("dongSelect", "dong", people, orderPayload.d);
            // ================================================
            // NGƯỜI SOẠN
            // ================================================
            createPeopleSelector("soanSelect", "soan", people, orderPayload.s);
            // ================================================
            // NGƯỜI GIAO
            // ================================================
            createPeopleSelector("giaoSelect", "giao", people, orderPayload.g);
            // ================================================
            // SỐ KIỆN
            // ================================================
            document.getElementById("so_kien").value = Number(orderPayload.k) || 0;
            // ================================================
            // COUNT
            // ================================================
            updateCount();
            console.log("Mini App initialized:", orderPayload);
          } catch (error) {
            console.error("INIT ERROR:", error);
            showError(error.message || "Có lỗi khi khởi tạo ứng dụng.");
          }
        }
        // =====================================================
        // START
        // =====================================================
        init();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
   <meta charset="UTF-8" />

   <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
   />

   <script src="https://telegram.org/js/telegram-web-app.js"></script>

   <title>Order Editor</title>

   <style>
      * {
         box-sizing: border-box;
      }

      body {
         margin: 0;
         padding: 20px;
         font-family: Arial, sans-serif;
         background: #f5f7fa;
         color: #222;
      }

      .container {
         max-width: 500px;
         margin: auto;
         background: #fff;
         padding: 20px;
         border-radius: 14px;
         box-shadow: 0 4px 18px rgba(0,0,0,.08);
      }

      h3 {
         margin-top: 0;
         margin-bottom: 20px;
      }

      label {
         display: block;
         margin-top: 14px;
         margin-bottom: 6px;
         font-weight: 600;
      }

      select,
      input {
         width: 100%;
         padding: 11px 12px;
         border: 1px solid #d0d5dd;
         border-radius: 8px;
         font-size: 16px;
         background: #fff;
      }

      select[multiple] {
         min-height: 120px;
      }

      .hint {
         margin-top: 4px;
         font-size: 12px;
         color: #667085;
      }

      button {
         width: 100%;
         margin-top: 22px;
         padding: 12px;
         border: 0;
         border-radius: 8px;
         background: #0088cc;
         color: white;
         font-size: 16px;
         font-weight: 600;
         cursor: pointer;
      }

      button:active {
         opacity: .8;
      }

      #error {
         display: none;
         margin-top: 15px;
         padding: 10px;
         border-radius: 8px;
         background: #fee4e2;
         color: #b42318;
         font-size: 14px;
      }
   </style>
</head>

<body>

<div class="container">

   <h3>✏️ Chỉnh sửa đơn hàng</h3>

   <!-- Người đóng -->
   <label for="dong">
      Người đóng
   </label>

   <select id="dong" multiple></select>

   <div class="hint">
      Có thể chọn nhiều người bằng Ctrl / Command
   </div>


   <!-- Người soạn -->
   <label for="soan">
      Người soạn
   </label>

   <select id="soan" multiple></select>

   <div class="hint">
      Có thể chọn nhiều người bằng Ctrl / Command
   </div>


   <!-- Người giao -->
   <label for="giao">
      Người giao
   </label>

   <select id="giao" multiple></select>

   <div class="hint">
      Có thể chọn nhiều người bằng Ctrl / Command
   </div>


   <!-- Số kiện -->
   <label for="so_kien">
      Số kiện
   </label>

   <input
      id="so_kien"
      type="number"
      min="0"
      step="1"
      value="0"
   />


   <button type="button" onclick="submitForm()">
      SUBMIT
   </button>

   <div id="error"></div>

</div>


<script>

   const tg = window.Telegram.WebApp;

   tg.ready();
   tg.expand();


   // =====================================================
   // ERROR
   // =====================================================

   function showError(message) {

      const error =
         document.getElementById("error");

      error.innerText = message;
      error.style.display = "block";

      console.error(message);
   }


   function clearError() {

      const error =
         document.getElementById("error");

      error.innerText = "";
      error.style.display = "none";
   }


   // =====================================================
   // BASE64URL DECODE
   // =====================================================

   function decodeBase64Url(str) {

      str = String(str)
         .replace(/-/g, "+")
         .replace(/_/g, "/");

      while (str.length % 4) {
         str += "=";
      }

      const binary = atob(str);

      const bytes =
         Uint8Array.from(
            binary,
            c => c.charCodeAt(0)
         );

      return new TextDecoder("utf-8")
         .decode(bytes);
   }


   // =====================================================
   // GET PAYLOAD
   // =====================================================

   function getPayload() {

      const startapp =
         tg.initDataUnsafe?.start_param;

      console.log(
         "startapp:",
         startapp
      );


      // Cho phép mở trực tiếp để test
      if (!startapp) {

         console.warn(
            "Không có startapp - chạy chế độ TEST"
         );

         return {
            id: 12345,

            p: [
               { id: 1, name: "An" },
               { id: 2, name: "Bình" },
               { id: 3, name: "Chi" },
               { id: 4, name: "Dũng" },
               { id: 5, name: "Hà" },
               { id: 6, name: "Hùng" },
               { id: 7, name: "Lan" },
               { id: 8, name: "Linh" },
               { id: 9, name: "Mai" },
               { id: 10, name: "Minh" },
               { id: 11, name: "Nam" },
               { id: 12, name: "Nga" },
               { id: 13, name: "Ngọc" },
               { id: 14, name: "Phúc" },
               { id: 15, name: "Quân" },
               { id: 16, name: "Sơn" },
               { id: 17, name: "Tâm" },
               { id: 18, name: "Thảo" },
               { id: 19, name: "Trang" },
               { id: 20, name: "Tuấn" },
               { id: 21, name: "Vân" },
               { id: 22, name: "Việt" },
               { id: 23, name: "Yến" },
               { id: 24, name: "Khoa" },
               { id: 25, name: "Long" }
            ],

            s: [8, 18],
            d: [2],
            g: [2, 15, 20],
            k: 12
         };
      }


      try {

         const json =
            decodeBase64Url(startapp);

         console.log(
            "Decoded JSON:",
            json
         );

         const payload =
            JSON.parse(json);

         console.log(
            "Payload:",
            payload
         );

         return payload;

      } catch (error) {

         throw new Error(
            "Không thể đọc startapp: " +
            error.message
         );
      }
   }


   // =====================================================
   // FILL MULTI SELECT
   // =====================================================

   function fillSelect(
      elementId,
      people,
      selectedIds
   ) {

      const select =
         document.getElementById(elementId);

      select.innerHTML = "";


      if (!Array.isArray(people)) {

         console.warn(
            "people không phải array:",
            people
         );

         return;
      }


      if (!Array.isArray(selectedIds)) {
         selectedIds = [];
      }


      // Đưa về string để so sánh
      const selectedSet =
         new Set(
            selectedIds.map(
               id => String(id)
            )
         );


      people.forEach(person => {

         const option =
            document.createElement("option");

         option.value =
            person.id;

         option.textContent =
            person.name;

         if (
            selectedSet.has(
               String(person.id)
            )
         ) {
            option.selected = true;
         }

         select.appendChild(option);

      });
   }


   // =====================================================
   // GET SELECTED IDS
   // =====================================================

   function getSelectedIds(elementId) {

      const select =
         document.getElementById(elementId);

      return Array.from(
         select.selectedOptions
      ).map(
         option => Number(option.value)
      );
   }


   // =====================================================
   // LOAD FORM
   // =====================================================

   function loadForm() {

      try {

         clearError();

         const payload =
            getPayload();


         console.log(
            "ORDER ID:",
            payload.id
         );

         console.log(
            "PEOPLE:",
            payload.p
         );


         // -----------------------------
         // Người đóng
         // -----------------------------

         fillSelect(
            "dong",
            payload.p,
            payload.d
         );


         // -----------------------------
         // Người soạn
         // -----------------------------

         fillSelect(
            "soan",
            payload.p,
            payload.s
         );


         // -----------------------------
         // Người giao
         // -----------------------------

         fillSelect(
            "giao",
            payload.p,
            payload.g
         );


         // -----------------------------
         // Số kiện
         // -----------------------------

         document.getElementById(
            "so_kien"
         ).value =
            payload.k ?? 0;


         console.log(
            "Form loaded."
         );

      } catch (error) {

         showError(
            error.message
         );
      }
   }


   // =====================================================
   // SUBMIT
   // =====================================================

   function submitForm() {

      try {

         clearError();


         const data = {

            // ID đơn hàng
            id:
               window.orderPayload?.id ??
               null,

            // Người đóng
            d:
               getSelectedIds("dong"),

            // Người soạn
            s:
               getSelectedIds("soan"),

            // Người giao
            g:
               getSelectedIds("giao"),

            // Số kiện
            k:
               Number(
                  document.getElementById(
                     "so_kien"
                  ).value
               )
         };


         console.log(
            "SEND DATA:",
            data
         );


         // -----------------------------
         // Validate
         // -----------------------------

         if (!data.d.length) {

            showError(
               "Vui lòng chọn người đóng."
            );

            return;
         }


         if (!data.s.length) {

            showError(
               "Vui lòng chọn người soạn."
            );

            return;
         }


         if (!data.g.length) {

            showError(
               "Vui lòng chọn người giao."
            );

            return;
         }


         // -----------------------------
         // Gửi về Telegram
         // -----------------------------

         tg.sendData(
            JSON.stringify(data)
         );

      } catch (error) {

         showError(
            "Lỗi submit: " +
            error.message
         );
      }
   }


   // =====================================================
   // INIT
   // =====================================================

   let orderPayload = null;


   try {

      orderPayload =
         getPayload();

      // lưu để submit
      window.orderPayload =
         orderPayload;

   } catch (error) {

      showError(
         error.message
      );
   }


   if (orderPayload) {
      loadForm();
   }

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
   <meta charset="UTF-8">

   <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
   >

   <script src="https://telegram.org/js/telegram-web-app.js"></script>

   <title>Order Editor</title>

   <style>
      * {
         box-sizing: border-box;
      }

      :root {
         --bg: var(--tg-theme-bg-color, #f4f6f8);
         --card: var(--tg-theme-secondary-bg-color, #ffffff);
         --text: var(--tg-theme-text-color, #222222);
         --hint: var(--tg-theme-hint-color, #777777);
         --button: var(--tg-theme-button-color, #2481cc);
         --button-text: var(--tg-theme-button-text-color, #ffffff);
         --border: #e2e5e9;
         --selected: #e8f3ff;
      }

      html,
      body {
         margin: 0;
         padding: 0;
         background: var(--bg);
         color: var(--text);
         font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;
      }

      body {
         padding: 14px;
         padding-bottom: 90px;
      }

      .container {
         width: 100%;
         max-width: 520px;
         margin: auto;
      }

      .header {
         margin-bottom: 18px;
      }

      .title {
         font-size: 22px;
         font-weight: 700;
         margin: 0;
      }

      .order-info {
         margin-top: 5px;
         color: var(--hint);
         font-size: 13px;
      }

      .section {
         background: var(--card);
         border-radius: 14px;
         padding: 14px;
         margin-bottom: 12px;
         box-shadow: 0 1px 4px rgba(0,0,0,.06);
      }

      .section-title {
         display: flex;
         align-items: center;
         justify-content: space-between;
         margin-bottom: 10px;
      }

      .section-title-left {
         font-size: 15px;
         font-weight: 700;
      }

      .count {
         font-size: 12px;
         color: var(--hint);
      }

      /* =========================================
         PEOPLE SELECTOR
         ========================================= */

      .people-box {
         border: 1px solid var(--border);
         border-radius: 11px;
         overflow: hidden;
      }

      .search-box {
         position: relative;
         border-bottom: 1px solid var(--border);
      }

      .search-box input {
         width: 100%;
         border: 0;
         outline: 0;
         padding: 11px 12px 11px 38px;
         background: transparent;
         color: var(--text);
         font-size: 15px;
      }

      .search-icon {
         position: absolute;
         left: 12px;
         top: 50%;
         transform: translateY(-50%);
         color: var(--hint);
         font-size: 16px;
      }

      .selected-chips {
         display: flex;
         flex-wrap: wrap;
         gap: 6px;
         padding: 9px;
         border-bottom: 1px solid var(--border);
      }

      .selected-chips:empty {
         display: none;
      }

      .chip {
         display: inline-flex;
         align-items: center;
         gap: 5px;
         padding: 5px 9px;
         border-radius: 20px;
         background: var(--selected);
         color: var(--button);
         font-size: 13px;
         font-weight: 600;
      }

      .chip-remove {
         border: 0;
         background: transparent;
         color: inherit;
         padding: 0;
         margin: 0;
         font-size: 16px;
         line-height: 14px;
         cursor: pointer;
      }

      .people-list {
         max-height: 220px;
         overflow-y: auto;
      }

      .person {
         display: flex;
         align-items: center;
         min-height: 48px;
         padding: 8px 11px;
         cursor: pointer;
         border-bottom: 1px solid rgba(0,0,0,.04);
         -webkit-tap-highlight-color: transparent;
      }

      .person:last-child {
         border-bottom: 0;
      }

      .person:active {
         background: var(--selected);
      }

      .person-info {
         flex: 1;
         min-width: 0;
         margin-left: 10px;
      }

      .person-name {
         font-size: 15px;
         font-weight: 500;
      }

      .person-id {
         margin-top: 2px;
         font-size: 11px;
         color: var(--hint);
      }

      /* =========================================
         CUSTOM CHECKBOX
         ========================================= */

      .checkbox {
         width: 22px;
         height: 22px;
         flex: 0 0 22px;
         border: 2px solid #c8cdd3;
         border-radius: 6px;
         display: flex;
         align-items: center;
         justify-content: center;
         transition: .15s;
      }

      .person.selected .checkbox {
         background: var(--button);
         border-color: var(--button);
      }

      .person.selected .checkbox::after {
         content: "✓";
         color: white;
         font-size: 14px;
         font-weight: 700;
      }

      .empty {
         padding: 18px;
         text-align: center;
         color: var(--hint);
         font-size: 13px;
      }

      /* =========================================
         NUMBER INPUT
         ========================================= */

      .number-input {
         display: flex;
         align-items: center;
         gap: 8px;
      }

      .number-input button {
         width: 42px;
         height: 42px;
         border: 0;
         border-radius: 10px;
         background: var(--bg);
         color: var(--text);
         font-size: 22px;
         cursor: pointer;
      }

      .number-input input {
         flex: 1;
         min-width: 0;
         height: 42px;
         border: 1px solid var(--border);
         border-radius: 10px;
         text-align: center;
         font-size: 18px;
         font-weight: 600;
         background: transparent;
         color: var(--text);
         outline: none;
      }

      /* =========================================
         BUTTON
         ========================================= */

      .submit-button {
         width: 100%;
         height: 48px;
         border: 0;
         border-radius: 12px;
         background: var(--button);
         color: var(--button-text);
         font-size: 16px;
         font-weight: 700;
         cursor: pointer;
      }

      .submit-button:active {
         opacity: .8;
      }

      .submit-button:disabled {
         opacity: .5;
      }

      /* =========================================
         ERROR
         ========================================= */

      #error {
         display: none;
         margin-top: 12px;
         padding: 11px;
         border-radius: 10px;
         background: #fee4e2;
         color: #b42318;
         font-size: 13px;
      }

      /* =========================================
         LOADING
         ========================================= */

      .loading {
         text-align: center;
         padding: 30px;
         color: var(--hint);
      }
   </style>
</head>

<body>

<div class="container">

   <div class="header">
      <h1 class="title">✏️ Chỉnh sửa đơn hàng</h1>

      <div class="order-info">
         Đơn hàng: <strong id="orderId">...</strong>
      </div>
   </div>


   <!-- ================================
        NGƯỜI ĐÓNG
        ================================= -->

   <div class="section">

      <div class="section-title">
         <div class="section-title-left">
            📦 Người đóng
         </div>

         <div
            class="count"
            id="dongCount"
         >
            0 người
         </div>
      </div>

      <div
         class="people-box"
         id="dongBox"
      ></div>

   </div>


   <!-- ================================
        NGƯỜI SOẠN
        ================================= -->

   <div class="section">

      <div class="section-title">
         <div class="section-title-left">
            📝 Người soạn
         </div>

         <div
            class="count"
            id="soanCount"
         >
            0 người
         </div>
      </div>

      <div
         class="people-box"
         id="soanBox"
      ></div>

   </div>


   <!-- ================================
        NGƯỜI GIAO
        ================================= -->

   <div class="section">

      <div class="section-title">
         <div class="section-title-left">
            🚚 Người giao
         </div>

         <div
            class="count"
            id="giaoCount"
         >
            0 người
         </div>
      </div>

      <div
         class="people-box"
         id="giaoBox"
      ></div>

   </div>


   <!-- ================================
        SỐ KIỆN
        ================================= -->

   <div class="section">

      <div class="section-title">
         <div class="section-title-left">
            📦 Số kiện
         </div>
      </div>

      <div class="number-input">

         <button
            type="button"
            onclick="changeQuantity(-1)"
         >
            −
         </button>

         <input
            id="so_kien"
            type="number"
            min="0"
            step="1"
            value="0"
         >

         <button
            type="button"
            onclick="changeQuantity(1)"
         >
            +
         </button>

      </div>

   </div>


   <button
      id="submitButton"
      class="submit-button"
      type="button"
      onclick="submitForm()"
   >
      ✓ LƯU ĐƠN HÀNG
   </button>


   <div id="error"></div>

</div>


<script>

   // =====================================================
   // TELEGRAM
   // =====================================================

   const tg = window.Telegram.WebApp;

   tg.ready();
   tg.expand();

   // Cho Telegram biết màu header
   if (tg.setHeaderColor) {
      tg.setHeaderColor(
         tg.themeParams.bg_color ||
         "#f4f6f8"
      );
   }


   // =====================================================
   // GLOBAL DATA
   // =====================================================

   let orderPayload = null;

   /*
      selections:

      {
         dong: Set([2]),
         soan: Set([8,18]),
         giao: Set([2,15,20])
      }
   */

   const selections = {
      dong: new Set(),
      soan: new Set(),
      giao: new Set()
   };


   // =====================================================
   // ERROR
   // =====================================================

   function showError(message) {

      const el =
         document.getElementById("error");

      el.textContent = message;
      el.style.display = "block";

      window.scrollTo({
         top: document.body.scrollHeight,
         behavior: "smooth"
      });
   }


   function clearError() {

      const el =
         document.getElementById("error");

      el.textContent = "";
      el.style.display = "none";
   }


   // =====================================================
   // BASE64URL DECODE
   // =====================================================

   function decodeBase64Url(str) {

      str = String(str)
         .replace(/-/g, "+")
         .replace(/_/g, "/");

      while (str.length % 4 !== 0) {
         str += "=";
      }

      const binary = atob(str);

      const bytes =
         Uint8Array.from(
            binary,
            c => c.charCodeAt(0)
         );

      return new TextDecoder("utf-8")
         .decode(bytes);
   }


   // =====================================================
   // GET PAYLOAD
   // =====================================================

   function getPayload() {

      const startapp =
         tg.initDataUnsafe?.start_param;

      console.log(
         "Telegram startapp:",
         startapp
      );


      // =========================================
      // TEST MODE
      // =========================================

      if (!startapp) {

         console.warn(
            "Không có startapp → TEST MODE"
         );

         return {
            id: 12345,

            p: [
               { id: 1, name: "An" },
               { id: 2, name: "Bình" },
               { id: 3, name: "Chi" },
               { id: 4, name: "Dũng" },
               { id: 5, name: "Hà" },
               { id: 6, name: "Hùng" },
               { id: 7, name: "Lan" },
               { id: 8, name: "Linh" },
               { id: 9, name: "Mai" },
               { id: 10, name: "Minh" },
               { id: 11, name: "Nam" },
               { id: 12, name: "Nga" },
               { id: 13, name: "Ngọc" },
               { id: 14, name: "Phúc" },
               { id: 15, name: "Quân" },
               { id: 16, name: "Sơn" },
               { id: 17, name: "Tâm" },
               { id: 18, name: "Thảo" },
               { id: 19, name: "Trang" },
               { id: 20, name: "Tuấn" },
               { id: 21, name: "Vân" },
               { id: 22, name: "Việt" },
               { id: 23, name: "Yến" },
               { id: 24, name: "Khoa" },
               { id: 25, name: "Long" }
            ],

            s: [8, 18],
            d: [2],
            g: [2, 15, 20],
            k: 12
         };
      }


      // =========================================
      // DECODE
      // =========================================

      try {

         const json =
            decodeBase64Url(startapp);

         console.log(
            "Decoded:",
            json
         );

         const payload =
            JSON.parse(json);

         console.log(
            "Payload:",
            payload
         );

         return payload;

      } catch (error) {

         console.error(
            error
         );

         throw new Error(
            "Không đọc được dữ liệu startapp."
         );
      }
   }


   // =====================================================
   // CREATE PEOPLE SELECTOR
   // =====================================================

   function createPeopleSelector(
      boxId,
      type,
      people,
      selectedIds
   ) {

      const box =
         document.getElementById(boxId);

      box.innerHTML = "";


      // -----------------------------------------
      // SEARCH
      // -----------------------------------------

      const searchBox =
         document.createElement("div");

      searchBox.className =
         "search-box";

      searchBox.innerHTML = `
         <span class="search-icon">⌕</span>
         <input
            type="search"
            placeholder="Tìm tên..."
            autocomplete="off"
         >
      `;

      box.appendChild(searchBox);


      // -----------------------------------------
      // CHIPS
      // -----------------------------------------

      const chips =
         document.createElement("div");

      chips.className =
         "selected-chips";

      chips.id =
         `${type}Chips`;

      box.appendChild(chips);


      // -----------------------------------------
      // PEOPLE LIST
      // -----------------------------------------

      const list =
         document.createElement("div");

      list.className =
         "people-list";

      list.id =
         `${type}List`;

      box.appendChild(list);


      // -----------------------------------------
      // INITIAL SELECTION
      // -----------------------------------------

      if (Array.isArray(selectedIds)) {

         selectedIds.forEach(id => {

            selections[type].add(
               String(id)
            );

         });
      }


      // -----------------------------------------
      // RENDER PEOPLE
      // -----------------------------------------

      function renderPeople(
         filter = ""
      ) {

         list.innerHTML = "";

         const keyword =
            filter
               .trim()
               .toLowerCase();


         const filtered =
            people.filter(person => {

               if (!keyword) {
                  return true;
               }

               return String(person.name)
                  .toLowerCase()
                  .includes(keyword);

            });


         if (!filtered.length) {

            list.innerHTML = `
               <div class="empty">
                  Không tìm thấy người phù hợp
               </div>
            `;

            return;
         }


         filtered.forEach(person => {

            const id =
               String(person.id);

            const selected =
               selections[type].has(id);


            const row =
               document.createElement("div");

            row.className =
               "person" +
               (selected ? " selected" : "");


            row.dataset.id = id;


            row.innerHTML = `
               <div class="checkbox"></div>

               <div class="person-info">
                  <div class="person-name">
                     ${escapeHtml(person.name)}
                  </div>

                  <div class="person-id">
                     ID: ${escapeHtml(id)}
                  </div>
               </div>
            `;


            row.addEventListener(
               "click",
               () => {

                  togglePerson(
                     type,
                     person.id
                  );

                  renderPeople(
                     searchBox
                        .querySelector("input")
                        .value
                  );

                  renderChips();

                  updateCount();

               }
            );


            list.appendChild(row);

         });

      }


      // -----------------------------------------
      // RENDER CHIPS
      // -----------------------------------------

      function renderChips() {

         chips.innerHTML = "";


         people.forEach(person => {

            const id =
               String(person.id);

            if (
               !selections[type].has(id)
            ) {
               return;
            }


            const chip =
               document.createElement("div");

            chip.className =
               "chip";


            chip.innerHTML = `
               <span>
                  ${escapeHtml(person.name)}
               </span>

               <button
                  type="button"
                  class="chip-remove"
               >
                  ×
               </button>
            `;


            chip
               .querySelector(".chip-remove")
               .addEventListener(
                  "click",
                  event => {

                     event.stopPropagation();

                     selections[type].delete(
                        id
                     );

                     renderPeople(
                        searchBox
                           .querySelector("input")
                           .value
                     );

                     renderChips();

                     updateCount();

                  }
               );


            chips.appendChild(chip);

         });

      }


      // -----------------------------------------
      // SEARCH EVENT
      // -----------------------------------------

      searchBox
         .querySelector("input")
         .addEventListener(
            "input",
            event => {

               renderPeople(
                  event.target.value
               );

            }
         );


      // -----------------------------------------
      // FIRST RENDER
      // -----------------------------------------

      renderPeople();

      renderChips();

      updateCount();
   }


   // =====================================================
   // TOGGLE PERSON
   // =====================================================

   function togglePerson(
      type,
      id
   ) {

      id = String(id);

      if (
         selections[type].has(id)
      ) {

         selections[type].delete(id);

      } else {

         selections[type].add(id);

      }
   }


   // =====================================================
   // COUNT
   // =====================================================

   function updateCount() {

      document.getElementById(
         "dongCount"
      ).textContent =
         `${selections.dong.size} người`;


      document.getElementById(
         "soanCount"
      ).textContent =
         `${selections.soan.size} người`;


      document.getElementById(
         "giaoCount"
      ).textContent =
         `${selections.giao.size} người`;
   }


   // =====================================================
   // HTML ESCAPE
   // =====================================================

   function escapeHtml(value) {

      return String(value)
         .replace(/&/g, "&amp;")
         .replace(/</g, "&lt;")
         .replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;")
         .replace(/'/g, "&#039;");
   }


   // =====================================================
   // QUANTITY
   // =====================================================

   function changeQuantity(delta) {

      const input =
         document.getElementById(
            "so_kien"
         );

      let value =
         Number(input.value) || 0;

      value += delta;

      if (value < 0) {
         value = 0;
      }

      input.value = value;
   }


   // =====================================================
   // GET SELECTED IDS
   // =====================================================

   function getSelectedIds(type) {

      return Array.from(
         selections[type]
      ).map(
         id => Number(id)
      );
   }


   // =====================================================
   // SUBMIT → TELEGRAM
   // =====================================================

   function submitForm() {

      clearError();


      const data = {

         // ID đơn
         id: orderPayload.id,

         // Người đóng
         d: getSelectedIds("dong"),

         // Người soạn
         s: getSelectedIds("soan"),

         // Người giao
         g: getSelectedIds("giao"),

         // Số kiện
         k:
            Number(
               document.getElementById(
                  "so_kien"
               ).value
            ) || 0
      };


      console.log(
         "SEND TO TELEGRAM:",
         data
      );


      // -----------------------------------------
      // VALIDATE
      // -----------------------------------------

      if (!data.d.length) {

         showError(
            "Vui lòng chọn ít nhất một người đóng."
         );

         return;
      }


      if (!data.s.length) {

         showError(
            "Vui lòng chọn ít nhất một người soạn."
         );

         return;
      }


      if (!data.g.length) {

         showError(
            "Vui lòng chọn ít nhất một người giao."
         );

         return;
      }


      // -----------------------------------------
      // DISABLE BUTTON
      // -----------------------------------------

      const button =
         document.getElementById(
            "submitButton"
         );

      button.disabled = true;

      button.textContent =
         "Đang gửi...";


      // -----------------------------------------
      // SEND DATA TO TELEGRAM BOT
      // -----------------------------------------

      try {

         tg.sendData(
            JSON.stringify(data)
         );

         console.log(
            "Đã gửi dữ liệu về Telegram Bot"
         );

      } catch (error) {

         button.disabled = false;

         button.textContent =
            "✓ LƯU ĐƠN HÀNG";

         showError(
            "Không thể gửi dữ liệu về Telegram: " +
            error.message
         );

      }
   }


   // =====================================================
   // INIT
   // =====================================================

   function init() {

      try {

         orderPayload =
            getPayload();


         if (!orderPayload) {
            return;
         }


         // -----------------------------------------
         // ORDER ID
         // -----------------------------------------

         document.getElementById(
            "orderId"
         ).textContent =
            orderPayload.id;


         // -----------------------------------------
         // PEOPLE
         // -----------------------------------------

         const people =
            Array.isArray(orderPayload.p)
               ? orderPayload.p
               : [];


         // -----------------------------------------
         // DONG
         // -----------------------------------------

         createPeopleSelector(
            "dongBox",
            "dong",
            people,
            orderPayload.d
         );


         // -----------------------------------------
         // SOAN
         // -----------------------------------------

         createPeopleSelector(
            "soanBox",
            "soan",
            people,
            orderPayload.s
         );


         // -----------------------------------------
         // GIAO
         // -----------------------------------------

         createPeopleSelector(
            "giaoBox",
            "giao",
            people,
            orderPayload.g
         );


         // -----------------------------------------
         // SO KIEN
         // -----------------------------------------

         document.getElementById(
            "so_kien"
         ).value =
            Number(orderPayload.k) || 0;


         updateCount();


      } catch (error) {

         showError(
            error.message
         );

      }
   }


   init();

</script>

</body>
</html>
